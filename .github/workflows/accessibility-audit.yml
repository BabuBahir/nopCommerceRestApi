
name: CSharp Accessibility Audit

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-audit:
    name: ReSharper Accessibility Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate solution files
        shell: bash
        run: |
          echo "Repository: $GITHUB_WORKSPACE"
          echo "Solution files:"
          find "$GITHUB_WORKSPACE" -maxdepth 5 \
            \( -name '*.sln' -o -name '*.slnx' \) -print

          if [ ! -f "$GITHUB_WORKSPACE/src/NopCommerce.sln" ]; then
            echo "::error::Expected solution not found: src/NopCommerce.sln"
            exit 1
          fi

      - name: Run ReSharper InspectCode
        id: inspect
        continue-on-error: true
        uses: JetBrains/ReSharper-InspectCode@v0.13
        with:
          solution: ./src/NopCommerce.sln
          tool-version: 2026.1.0.1
          dotnet-version: 10.x
          swea: true
          sEverity: HINT
          format: Html
          output: ${{ github.workspace }}/accessibility-report.html

      - name: Diagnose generated report
        if: always()
        shell: bash
        run: |
          echo "InspectCode step outcome: ${{ steps.inspect.outcome }}"
          echo "Searching for generated reports..."

          find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
            \( -iname '*report*.html' -o -iname '*inspectcode*.xml' \) \
            -print

          if [ -f "$GITHUB_WORKSPACE/accessibility-report.html" ]; then
            echo "HTML report found:"
            ls -lh "$GITHUB_WORKSPACE/accessibility-report.html"
          else
            echo "::warning::Expected HTML report was not generated."
          fi

      - name: Upload accessibility audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nopcommerce-accessibility-audit
          path: accessibility-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if inspection failed
        if: steps.inspect.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::ReSharper InspectCode failed. Review its logs."
          exit 1
