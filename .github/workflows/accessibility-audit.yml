```yaml
name: CSharp Accessibility Audit

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-audit:
    name: C# Accessibility Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Verify solution
        shell: bash
        run: |
          test -f src/NopCommerce.sln || {
            echo "::error::src/NopCommerce.sln was not found"
            exit 1
          }

      - name: Run ReSharper InspectCode
        id: inspect
        continue-on-error: true
        uses: JetBrains/ReSharper-InspectCode@v0.13
        with:
          solution: ./src/NopCommerce.sln
          tool-version: 2026.1.0.1
          dotnet-version: 10.x
          swea: true
          sEverity: HINT
          format: Xml
          output: ${{ github.workspace }}/inspectcode-report.xml

      - name: Filter accessibility findings
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          source = "inspectcode-report.xml"
          destination = "accessibility-report.xml"

          if not os.path.isfile(source):
              print("No InspectCode report was generated.")
              print("Inspect the Run ReSharper InspectCode logs for the actual failure.")
              raise SystemExit(0)

          root = ET.parse(source).getroot()

          # Retain only findings whose inspection IDs or descriptions
          # indicate reduced accessibility / unnecessary visibility.
          keywords = (
              "membercanbeprivate",
              "membercanbeprotected",
              "typecanbeprivate",
              "typecanbeinternal",
              "accessibility",
              "can be made private",
              "can be made protected",
              "can be made internal",
              "can be made less accessible",
              "visibility can be reduced",
          )

          issue_types = {}
          for item in root.iter("IssueType"):
              issue_id = item.attrib.get("Id", "")
              description = item.attrib.get("Description", "")
              issue_types[issue_id] = (description, item.attrib)

          selected_ids = {
              issue_id
              for issue_id, (description, _) in issue_types.items()
              if any(word in (issue_id + " " + description).lower()
                     for word in keywords)
          }

          filtered = ET.Element("AccessibilityAudit")
          filtered_types = ET.SubElement(filtered, "IssueTypes")
          filtered_issues = ET.SubElement(filtered, "Issues")

          for issue_id in sorted(selected_ids):
              description, attributes = issue_types[issue_id]
              node = ET.SubElement(filtered_types, "IssueType", attributes)
              node.text = description

          count = 0
          for issue in root.iter("Issue"):
              issue_id = issue.attrib.get("TypeId", "")
              if issue_id in selected_ids:
                  filtered_issues.append(issue)
                  count += 1

          ET.ElementTree(filtered).write(
              destination, encoding="utf-8", xml_declaration=True
          )

          print("Accessibility inspection IDs discovered:")
          for issue_id in sorted(selected_ids):
              print(f"  {issue_id}: {issue_types[issue_id][0]}")

          print(f"Filtered findings: {count}")
          print(f"Report: {destination}")
          PY

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-accessibility-audit
          path: |
            accessibility-report.xml
            inspectcode-report.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if InspectCode failed
        if: steps.inspect.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::InspectCode failed. Review its logs; the report may be incomplete."
          exit 1
```
